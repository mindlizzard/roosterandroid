name: Build Windows v0.10

on:
  push:
    branches: ["main", "feature/windows-v0.10"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Test and assemble desktop application
        run: gradle -p desktopApp clean test installDist --stacktrace

      - name: Install WiX Toolset
        shell: pwsh
        run: choco install wixtoolset --no-progress -y

      - name: Add WiX to PATH
        shell: pwsh
        run: |
          $wixRoot = Get-ChildItem "${env:ProgramFiles(x86)}" -Directory -Filter "WiX Toolset v3*" |
            Sort-Object LastWriteTime |
            Select-Object -Last 1
          if (-not $wixRoot) { throw "WiX Toolset v3 is niet gevonden" }
          "$($wixRoot.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build portable app and EXE installer
        shell: pwsh
        run: |
          $inputDir = "desktopApp\build\install\RoosterPlanner\lib"
          $outputDir = "desktopApp\build\windows"
          $icon = "desktopApp\src\main\resources\roosterplanner.ico"
          New-Item -ItemType Directory -Force -Path "$outputDir\portable", "$outputDir\installer" | Out-Null

          jpackage `
            --type app-image `
            --name RoosterPlanner `
            --app-version 0.10.0 `
            --vendor "RoosterPlanner" `
            --description "Offline roosterplanner met ATW-controle" `
            --input $inputDir `
            --main-jar "roosterplanner-windows-0.10.0.jar" `
            --main-class "nl.roosterandroid.desktop.DesktopMainKt" `
            --java-options "-Dfile.encoding=UTF-8" `
            --icon $icon `
            --dest "$outputDir\portable"

          Compress-Archive `
            -Path "$outputDir\portable\RoosterPlanner" `
            -DestinationPath "$outputDir\RoosterPlanner-0.10-portable.zip" `
            -CompressionLevel Optimal

          jpackage `
            --type exe `
            --name RoosterPlanner `
            --app-version 0.10.0 `
            --vendor "RoosterPlanner" `
            --description "Offline roosterplanner met ATW-controle" `
            --input $inputDir `
            --main-jar "roosterplanner-windows-0.10.0.jar" `
            --main-class "nl.roosterandroid.desktop.DesktopMainKt" `
            --java-options "-Dfile.encoding=UTF-8" `
            --icon $icon `
            --win-dir-chooser `
            --win-menu `
            --win-menu-group "RoosterPlanner" `
            --win-shortcut `
            --dest "$outputDir\installer"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: RoosterPlanner-Windows-v0.10
          path: |
            desktopApp/build/windows/RoosterPlanner-0.10-portable.zip
            desktopApp/build/windows/installer/*.exe
          if-no-files-found: error
          retention-days: 30
