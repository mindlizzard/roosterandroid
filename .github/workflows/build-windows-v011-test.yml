name: Build Windows v0.11.1 DEBUG

on:
  push:
    branches: ["feature/windows-v0.10"]
    paths:
      - ".v011/**"
      - ".github/workflows/build-windows-v011-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-v0111:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout v0.10 source
        uses: actions/checkout@v5

      - name: Apply v0.11 integration
        shell: pwsh
        run: python -X utf8 .v011/apply_v011_changes.py .

      - name: Apply v0.11.1 bugfixes
        shell: pwsh
        run: python -X utf8 .v011/apply_v0111_hotfix.py .

      - name: Static debug verification
        shell: pwsh
        run: python -X utf8 .v011/verify_v0111.py .

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Full regression tests and desktop build
        run: gradle -p desktopApp clean test installDist --stacktrace

      - name: Install WiX Toolset
        shell: pwsh
        run: choco install wixtoolset --no-progress -y

      - name: Add WiX to PATH
        shell: pwsh
        run: |
          $wixRoot = Get-ChildItem "${env:ProgramFiles(x86)}" -Directory -Filter "WiX Toolset v3*" |
            Sort-Object LastWriteTime |
            Select-Object -Last 1
          if (-not $wixRoot) { throw "WiX Toolset v3 is niet gevonden" }
          "$($wixRoot.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build portable app and EXE installer
        shell: pwsh
        run: |
          $inputDir = "desktopApp\build\install\RoosterPlanner\lib"
          $outputDir = "desktopApp\build\windows"
          $icon = "desktopApp\src\main\resources\roosterplanner.ico"
          New-Item -ItemType Directory -Force -Path "$outputDir\portable", "$outputDir\installer" | Out-Null

          jpackage `
            --type app-image `
            --name RoosterPlanner `
            --app-version 0.11.1 `
            --vendor "RoosterPlanner" `
            --description "Offline roosterplanner v0.11.1 debug met ATW-controle" `
            --input $inputDir `
            --main-jar "roosterplanner-windows-0.11.1.jar" `
            --main-class "nl.roosterandroid.desktop.DesktopMainKt" `
            --java-options "-Dfile.encoding=UTF-8" `
            --icon $icon `
            --dest "$outputDir\portable"

          Compress-Archive `
            -Path "$outputDir\portable\RoosterPlanner" `
            -DestinationPath "$outputDir\RoosterPlanner-0.11.1-debug-portable.zip" `
            -CompressionLevel Optimal

          jpackage `
            --type exe `
            --name RoosterPlanner `
            --app-version 0.11.1 `
            --vendor "RoosterPlanner" `
            --description "Offline roosterplanner v0.11.1 debug met ATW-controle" `
            --input $inputDir `
            --main-jar "roosterplanner-windows-0.11.1.jar" `
            --main-class "nl.roosterandroid.desktop.DesktopMainKt" `
            --java-options "-Dfile.encoding=UTF-8" `
            --icon $icon `
            --win-dir-chooser `
            --win-menu `
            --win-menu-group "RoosterPlanner" `
            --win-shortcut `
            --dest "$outputDir\installer"

      - name: Upload Windows v0.11.1 debug package
        uses: actions/upload-artifact@v4
        with:
          name: RoosterPlanner-Windows-v0.11.1-DEBUG
          path: |
            desktopApp/build/windows/RoosterPlanner-0.11.1-debug-portable.zip
            desktopApp/build/windows/installer/*.exe
          if-no-files-found: error
          retention-days: 7
